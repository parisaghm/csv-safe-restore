name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Test for reliance on the default file encoding
        # Windows defaults to a legacy code page, Linux and macOS to UTF-8.
        # This fails on any file access that does not name its encoding.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -p no:cacheprovider
      - name: Command line on the examples
        shell: bash
        run: |
          set -u
          inputs_sha() {
            python -c "import hashlib; print(hashlib.sha256(open('examples/original.csv','rb').read() + open('examples/edited.csv','rb').read()).hexdigest())"
          }
          before=$(inputs_sha)
          options="examples/original.csv examples/edited.csv --key product_id --gtin-columns barcode"

          csv-safe-restore --version
          python -m csv_safe_restore --version

          # The example data has findings that need review, so exit code 1 is expected.
          code=0; csv-safe-restore check $options > check.txt || code=$?
          test "$code" -eq 1

          code=0; csv-safe-restore repair $options --output repaired.csv --report repair.txt || code=$?
          test "$code" -eq 1
          cmp repaired.csv examples/repaired.csv

          code=0; csv-safe-restore repair $options --trust-key --output trust-key.csv --format json --report trust-key.json || code=$?
          test "$code" -eq 1

          # An existing output file is never replaced without --overwrite.
          code=0; csv-safe-restore repair $options --output repaired.csv 2> refused.txt || code=$?
          test "$code" -eq 2
          cmp repaired.csv examples/repaired.csv

          # The input files were not changed.
          test "$before" = "$(inputs_sha)"

  build:
    name: build wheel and source archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/csv_safe_restore/__init__.py', encoding='utf-8').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    # Install the built wheel into a clean environment, the way a user would.
    name: install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4 # only for the example files
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel and run it
        shell: bash
        run: |
          set -u
          python -m venv clean
          if [ -d clean/Scripts ]; then bin=clean/Scripts; else bin=clean/bin; fi
          $bin/python -m pip install dist/*.whl
          $bin/csv-safe-restore --version
          code=0; $bin/csv-safe-restore check examples/original.csv examples/edited.csv --key product_id --gtin-columns barcode || code=$?
          test "$code" -eq 1
          code=0; $bin/csv-safe-restore repair examples/original.csv examples/edited.csv --key product_id --gtin-columns barcode --output repaired.csv || code=$?
          test "$code" -eq 1
          cmp repaired.csv examples/repaired.csv
